[package]
name = "termloom-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
mlux = { version = "2.4.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "debuginfo"
lto = "thin"
panic = "abort"
