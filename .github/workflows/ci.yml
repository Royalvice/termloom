name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS x64
            os: macos-15
    env:
      CI: "true"
      TERM: xterm-256color
      COLORTERM: truecolor

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates curl ffmpeg htop less mpv openssh-client openssh-server \
            rclone tmux vim zsh
          sudo install -d -m 0755 /run/sshd
          curl --fail --show-error --location \
            --output /tmp/resvg-linux-x86_64-0.47.0.tar.gz \
            https://github.com/linebender/resvg/releases/download/v0.47.0/resvg-linux-x86_64.tar.gz
          echo "5c84dcbcd032fe7e8d96e616fd6807a2f9df6561d2e6582b37e91e63c6cb4fe7  /tmp/resvg-linux-x86_64-0.47.0.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/resvg-linux-x86_64-0.47.0.tar.gz -C /tmp
          sudo install -m 0755 /tmp/resvg /usr/local/bin/resvg

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg htop mpv rclone resvg tmux

      - name: Install exact JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Run format, lint, type, unit, snapshot, and integration gates
        run: bun run check

      - name: Compile the native executable
        run: bun run build

      - name: Verify native format and compiled doctor
        run: bun run verify:build

      - name: Upload native executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: termloom-${{ runner.os }}-${{ runner.arch }}
          path: dist/termloom
          if-no-files-found: error
          retention-days: 7
